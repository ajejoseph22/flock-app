# Flock on Coolify (Docker Compose build pack). One Coolify application per environment, e.g. staging.
# Setup and the full variable list: infra/coolify/README.md.
#
# Coolify builds both images from infra/docker/Dockerfile on the server, then starts:
#   postgres → migrate (one-shot) → web + worker → telegram-webhook (one-shot)
# Only `web` gets a domain (set it in Coolify: https://staging.useflock.com:3000). Postgres and the worker
# are reachable on the resource's internal network only.
#
# `${VAR:?}` variables are required: Coolify lists them under Environment Variables and the deploy fails
# fast if one is empty. SERVICE_USER_* / SERVICE_PASSWORD_* are generated by Coolify on first deploy.
# Variables are spelled out per service on purpose: Coolify only passes a variable to services that name it.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SERVICE_USER_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: flock
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - flock-pgdata:/var/lib/postgresql/data
    shm_size: 256mb
    stop_grace_period: 2m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d flock"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  migrate:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: worker
    command: ["node", "migrate/dist/migrate.js"]
    restart: "no"
    exclude_from_hc: true
    environment:
      DATABASE_URL: postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/flock
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: web
      args:
        # Statically rendered pages bake APP_URL in at build time.
        APP_URL: ${APP_URL:?}
        GIT_SHA: ${SOURCE_COMMIT:-dev}
    restart: unless-stopped
    environment:
      FLOCK_ENV: ${FLOCK_ENV:-production}
      APP_URL: ${APP_URL:?}
      DATABASE_URL: postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/flock
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:?}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:?}
      TELEGRAM_MODE: webhook
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?}
      STRIPE_CONNECT_WEBHOOK_SECRET: ${STRIPE_CONNECT_WEBHOOK_SECRET:?}
      STRIPE_PLATFORM_WEBHOOK_SECRET: ${STRIPE_PLATFORM_WEBHOOK_SECRET:?}
      STRIPE_ACCOUNTS_WEBHOOK_SECRET: ${STRIPE_ACCOUNTS_WEBHOOK_SECRET:?}
      PLATFORM_BILLING_ENABLED: ${PLATFORM_BILLING_ENABLED:-false}
      RENEWAL_GRACE_HOURS: ${RENEWAL_GRACE_HOURS:-48}
      INVITE_LINK_TTL_HOURS: ${INVITE_LINK_TTL_HOURS:-168}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-support@useflock.com}
      ADMIN_TELEGRAM_USER_IDS: ${ADMIN_TELEGRAM_USER_IDS:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Next.js and the worker drain on SIGTERM.
    stop_grace_period: 30s
    read_only: true
    tmpfs: [/tmp, "/app/apps/web/.next/cache:mode=1777"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: worker
      args:
        GIT_SHA: ${SOURCE_COMMIT:-dev}
    restart: unless-stopped
    environment:
      PORT: "8081"
      FLOCK_ENV: ${FLOCK_ENV:-production}
      APP_URL: ${APP_URL:?}
      DATABASE_URL: postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/flock
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:?}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:?}
      TELEGRAM_MODE: webhook
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?}
      STRIPE_CONNECT_WEBHOOK_SECRET: ${STRIPE_CONNECT_WEBHOOK_SECRET:?}
      STRIPE_PLATFORM_WEBHOOK_SECRET: ${STRIPE_PLATFORM_WEBHOOK_SECRET:?}
      STRIPE_ACCOUNTS_WEBHOOK_SECRET: ${STRIPE_ACCOUNTS_WEBHOOK_SECRET:?}
      PLATFORM_BILLING_ENABLED: ${PLATFORM_BILLING_ENABLED:-false}
      RENEWAL_GRACE_HOURS: ${RENEWAL_GRACE_HOURS:-48}
      INVITE_LINK_TTL_HOURS: ${INVITE_LINK_TTL_HOURS:-168}
      SUPPORT_EMAIL: ${SUPPORT_EMAIL:-support@useflock.com}
      ADMIN_TELEGRAM_USER_IDS: ${ADMIN_TELEGRAM_USER_IDS:-}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
    depends_on:
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 30s
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  # Registers https://<APP_URL>/api/webhooks/telegram with the secret token on every deploy (idempotent;
  # keeps pending updates). Runs once web is healthy so Telegram's first deliveries land.
  telegram-webhook:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: worker
    command: ["node", "tools/set-telegram-webhook.js"]
    restart: "no"
    exclude_from_hc: true
    environment:
      FLOCK_ENV: ${FLOCK_ENV:-production}
      APP_URL: ${APP_URL:?}
      DATABASE_URL: postgres://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/flock
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:?}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:?}
      TELEGRAM_MODE: webhook
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?}
      STRIPE_CONNECT_WEBHOOK_SECRET: ${STRIPE_CONNECT_WEBHOOK_SECRET:?}
      STRIPE_PLATFORM_WEBHOOK_SECRET: ${STRIPE_PLATFORM_WEBHOOK_SECRET:?}
      STRIPE_ACCOUNTS_WEBHOOK_SECRET: ${STRIPE_ACCOUNTS_WEBHOOK_SECRET:?}
    depends_on:
      web:
        condition: service_healthy

volumes:
  flock-pgdata: {}
